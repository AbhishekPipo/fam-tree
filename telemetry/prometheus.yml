global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Family Tree API Metrics
  - job_name: 'family-tree-api'
    static_configs:
      - targets: ['host.docker.internal:9090']  # App metrics port
    scrape_interval: 5s
    metrics_path: '/metrics'
    scheme: 'http'

  # Node.js Application Metrics (if using prom-client)
  - job_name: 'family-tree-app'
    static_configs:
      - targets: ['host.docker.internal:3000']  # App server port
    scrape_interval: 10s
    metrics_path: '/metrics'
    scheme: 'http'

  # OTEL Collector Metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 10s